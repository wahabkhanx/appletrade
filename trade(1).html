<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><script src="data.js"></script><script src="common.js"></script></head><body><script>

const mode='trade'; let cat='iphone', pickedColor='', pickedCondition='a+', quoteRejected=false;
const INSPECTION={
battery:[
{id:'b95',name:'95–100%',factor:1,desc:'Excellent battery health'},
{id:'b90',name:'90–94%',factor:.97,desc:'Very good'},
{id:'b85',name:'85–89%',factor:.93,desc:'Good; common resale range'},
{id:'b80',name:'80–84%',factor:.88,desc:'Service may be approaching'},
{id:'b79',name:'Below 80%',factor:.78,desc:'Battery service likely'}
],
screen:[
{id:'s0',name:'Excellent',factor:1},
{id:'s1',name:'Light scratches',factor:.97},
{id:'s2',name:'Heavy scratches',factor:.88},
{id:'s3',name:'Cracked / damaged',factor:.70}
],
body:[
{id:'body0',name:'Excellent',factor:1},
{id:'body1',name:'Light wear',factor:.97},
{id:'body2',name:'Dents / heavy wear',factor:.88},
{id:'body3',name:'Major damage',factor:.72}
],
functions:[
{id:'f0',name:'All functions working',factor:1},
{id:'f1',name:'Minor issue',factor:.90},
{id:'f2',name:'Major function fault',factor:.70}
],
parts:[
{id:'p0',name:'No replacement / Genuine Apple parts',factor:1},
{id:'p1',name:'Genuine replacement part',factor:.95},
{id:'p2',name:'Unknown / non-genuine part',factor:.84},
{id:'p3',name:'Parts warning / unfinished repair',factor:.70}
],
lock:[
{id:'l0',name:'Unlocked / ready to erase',factor:1},
{id:'l1',name:'Carrier locked',factor:.96},
{id:'l2',name:'Activation Lock / MDM / owner lock',factor:0}
],
region:[
{id:'r0',name:'UAE / GCC version',factor:1},
{id:'r1',name:'International version',factor:.98},
{id:'r2',name:'US / eSIM-only or region-specific',factor:.96}
],
accessories:[
{id:'a0',name:'Device only',bonus:0},
{id:'a1',name:'Box + cable',bonus:25},
{id:'a2',name:'Box + original cable + charger',bonus:50}
]};
function optionList(id,arr,selected){document.getElementById(id).innerHTML=arr.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${x.name}</option>`).join('')}
function selectedModel(){return CATALOG[cat].models[Number(document.getElementById('model').value)]}
function buildForm(){document.getElementById('model').innerHTML=CATALOG[cat].models.map((m,i)=>`<option value="${i}">${m.name}</option>`).join('');updateModel(); optionList('battery',INSPECTION.battery,'b90'); optionList('screen',INSPECTION.screen,'s0'); optionList('body',INSPECTION.body,'body0'); optionList('functions',INSPECTION.functions,'f0'); optionList('parts',INSPECTION.parts,'p0'); optionList('lock',INSPECTION.lock,'l0'); optionList('region',INSPECTION.region,'r0'); optionList('accessories',INSPECTION.accessories,'a0');}
function colorHex(c){const x=c.toLowerCase();if(x.includes('black'))return'#111827';if(x.includes('white'))return'#f5f5f5';if(x.includes('silver'))return'#d1d5db';if(x.includes('blue')||x.includes('glacier'))return'#8fb8df';if(x.includes('pink')||x.includes('rose'))return'#e9a9b9';if(x.includes('gold'))return'#d7b46a';if(x.includes('purple')||x.includes('lavender'))return'#a78bfa';if(x.includes('green')||x.includes('sage'))return'#94a884';if(x.includes('orange'))return'#f97316';if(x.includes('burgundy'))return'#7f1d3a';if(x.includes('natural'))return'#aaa28f';if(x.includes('space gray'))return'#6b7280';if(x.includes('midnight'))return'#172033';if(x.includes('starlight'))return'#e5ddc8';if(x.includes('yellow'))return'#eabf4a';if(x.includes('teal'))return'#2f9d96';return'#94a3b8'}
function updateModel(){const m=selectedModel();document.getElementById('display').textContent=m.display;document.getElementById('chip').textContent=m.chip;document.getElementById('colors').innerHTML=m.colors.map((c,i)=>`<button class="color ${i===0?'active':''}" onclick="pickColor('${c}',this)"><span class="color-dot" style="background:${colorHex(c)}"></span>${c}</button>`).join('');document.getElementById('storage').innerHTML=m.storage.map((s,i)=>`<option value="${i}">${s}</option>`).join('');const w=document.getElementById('memoryWrap');if(m.memory){w.style.display='block';document.getElementById('memory').innerHTML=m.memory.map(s=>`<option>${s}</option>`).join('')}else w.style.display='none';pickedColor=m.colors[0];document.getElementById('chosenColor').textContent=pickedColor;calculate()}
function pickColor(c,b){pickedColor=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('chosenColor').textContent=c;calculate()}
function pickCondition(id,b){pickedCondition=id;document.querySelectorAll('.condition').forEach(x=>x.classList.remove('active'));b.classList.add('active');calculate()}
function val(id,arr){return arr.find(x=>x.id===document.getElementById(id).value)||arr[0]}
function calculate(){
 const m=selectedModel(); if(!m)return;
 const idx=Number(document.getElementById('storage').value)||0;
 const cond=CONDITIONS.find(x=>x.id===pickedCondition)||CONDITIONS[0];
 const storageUplift=idx===0?0:idx===1?140:idx===2?320:520;
 let base=(m.base+storageUplift);
 const battery=val('battery',INSPECTION.battery), screen=val('screen',INSPECTION.screen), body=val('body',INSPECTION.body), functions=val('functions',INSPECTION.functions), parts=val('parts',INSPECTION.parts), lock=val('lock',INSPECTION.lock), region=val('region',INSPECTION.region), accessories=val('accessories',INSPECTION.accessories);
 quoteRejected=lock.factor===0;
 let price=base*cond.factor*battery.factor*screen.factor*body.factor*functions.factor*parts.factor*lock.factor*region.factor + accessories.bonus;
 if(mode==='trade')price*=1.05;
 price=Math.max(0,Math.round(price));
 document.getElementById('price').textContent=quoteRejected?'—':money(price);
 document.getElementById('chosenStorage').textContent=m.storage[idx];
 document.getElementById('chosenCondition').textContent=cond.name;
 document.getElementById('breakdown').innerHTML=quoteRejected?`<div class="reject">❌ Not eligible for an immediate quote: Activation Lock, MDM/owner lock or similar lock must be removed before AppleTrade.ae can accept the device.</div>`:`<div class="breakdown-row"><span>Model + storage</span><b>AED ${money(base)}</b></div><div class="breakdown-row"><span>Condition grade</span><b>${Math.round((cond.factor-1)*100)}%</b></div><div class="breakdown-row"><span>Battery ${battery.name}</span><b>${Math.round((battery.factor-1)*100)}%</b></div><div class="breakdown-row"><span>Screen / body / functions</span><b>${Math.round((screen.factor*body.factor*functions.factor-1)*100)}%</b></div><div class="breakdown-row"><span>Parts history</span><b>${Math.round((parts.factor-1)*100)}%</b></div><div class="breakdown-row"><span>Region</span><b>${Math.round((region.factor-1)*100)}%</b></div><div class="breakdown-row"><span>Accessories</span><b>+ AED ${accessories.bonus}</b></div>${mode==='trade'?'<div class="breakdown-row"><span>Trade-In bonus</span><b class="green">+5%</b></div>':''}<div class="breakdown-row total"><span>Estimated value</span><b>AED ${money(price)}</b></div>`;
 document.getElementById('quoteWarning').innerHTML=(battery.id==='b79'||screen.id==='s3'||parts.id==='p3')?'<div class="warn">⚠️ This condition can cause a larger adjustment after inspection. The online estimate is not a guaranteed purchase price.</div>':'';
}
function sendQuote(){if(quoteRejected){alert('Please remove Activation Lock / MDM / owner lock before requesting a quote.');return}const m=selectedModel(),idx=Number(document.getElementById('storage').value)||0,cond=CONDITIONS.find(x=>x.id===pickedCondition)||CONDITIONS[0];const mem=m.memory?document.getElementById('memory').value:'';const msg=`Hello AppleTrade.ae 👋
I want a ${mode==='sell'?'Sell Device':'Trade-In'} quote.
Device: ${m.name}
Colour: ${pickedColor}
Storage: ${m.storage[idx]}
${mem?'Memory: '+mem+'\n':''}Condition: ${cond.name}
Battery: ${document.getElementById('battery').selectedOptions[0].text}
Screen: ${document.getElementById('screen').selectedOptions[0].text}
Body: ${document.getElementById('body').selectedOptions[0].text}
Functions: ${document.getElementById('functions').selectedOptions[0].text}
Parts: ${document.getElementById('parts').selectedOptions[0].text}
Lock: ${document.getElementById('lock').selectedOptions[0].text}
Version: ${document.getElementById('region').selectedOptions[0].text}
Accessories: ${document.getElementById('accessories').selectedOptions[0].text}
Estimated Value: AED ${document.getElementById('price').textContent}
Please confirm final inspection and quote.`;location.href=waLink(msg)}
function initCalc(){const p=new URLSearchParams(location.search);cat=CATALOG[p.get('cat')]?p.get('cat'):'iphone';document.getElementById('catName').textContent=CATALOG[cat].label;buildForm();['battery','screen','body','functions','parts','lock','region','accessories'].forEach(id=>document.getElementById(id).addEventListener('change',calculate))}

shell('trade','AppleTrade.ae — Trade-In',`
<main class="container"><section class="page-title"><div class="eyebrow"><span class="dot"></span> TRADE-IN • advanced inspection estimate</div><h1>Trade-In your Apple device.</h1><p class="lead">We now price the details that actually move a UAE used-device quote: battery health, screen, body, functionality, parts history, locks, version and accessories.</p></section>
<div class="calc"><div class="card"><div class="form">
<div class="field"><label>1. Category</label><div class="grid4"><a class="filter" href="trade.html?cat=iphone">📱 iPhone</a><a class="filter" href="trade.html?cat=ipad">📟 iPad</a><a class="filter" href="trade.html?cat=macbook">💻 Mac</a><a class="filter" href="trade.html?cat=watch">⌚ Watch</a></div></div>
<div class="field"><label>2. Exact model</label><select id="model" class="select" onchange="updateModel()"></select><p class="muted"><span id="catName"></span> • <span id="display"></span> • <span id="chip"></span></p></div>
<div class="field"><label>3. Colour / finish</label><div id="colors" class="color-row"></div></div>
<div class="field"><label>4. Storage / connectivity</label><select id="storage" class="select" onchange="calculate()"></select></div>
<div class="field" id="memoryWrap" style="display:none"><label>5. Unified memory</label><select id="memory" class="select" onchange="calculate()"></select></div>
<div class="field"><label>6. Overall condition grade</label><div class="condition-grid"><button class="condition active" onclick="pickCondition('a+',this)"><b>A+ — Like New</b><small>No meaningful marks; fully functional.</small></button><button class="condition " onclick="pickCondition('a',this)"><b>A — Excellent</b><small>Light cosmetic wear; all functions work.</small></button><button class="condition " onclick="pickCondition('b',this)"><b>B — Good</b><small>Visible wear but usable.</small></button><button class="condition " onclick="pickCondition('c',this)"><b>C — Damaged</b><small>Cracks, dents or a defect.</small></button></div></div>
<div class="field"><label>7. Detailed inspection</label><div class="inspection-grid">
<div class="check-group"><label>Battery health</label><select id="battery"></select><div class="small-note">Apple says iPhone 15 batteries are designed to retain 80% capacity at 1,000 cycles under ideal conditions; actual results vary.</div></div>
<div class="check-group"><label>Screen</label><select id="screen"></select></div>
<div class="check-group"><label>Body / frame / back</label><select id="body"></select></div>
<div class="check-group"><label>Functions</label><select id="functions"></select></div>
<div class="check-group"><label>Parts & service history</label><select id="parts"></select></div>
<div class="check-group"><label>Activation / MDM / carrier lock</label><select id="lock"></select></div>
<div class="check-group"><label>Region / SIM configuration</label><select id="region"></select></div>
<div class="check-group"><label>Box & accessories</label><select id="accessories"></select></div>
</div></div>
<div class="card" style="padding:15px;background:#080e17"><b style="font-size:12px">Inspection checklist</b><p class="muted" style="margin:7px 0 0">Activation Lock • Find My • MDM • battery • Parts & Service History • display • cameras • Face ID / Touch ID • speakers • microphones • buttons • charging • Wi‑Fi/Bluetooth • SIM/eSIM • IMEI/serial where applicable.</p></div>
<div id="quoteWarning"></div>
</div></div>
<aside class="quote"><div class="eyebrow">Estimated value</div><div class="amount">AED <span id="price">0</span></div><p class="muted">Internal AppleTrade.ae estimate. Final value after inspection.</p><div class="breakdown" id="breakdown"></div><div style="text-align:left;margin:18px 0;font-size:11px;color:#9aa7b7;line-height:1.8">Colour: <b id="chosenColor" style="color:#fff"></b><br>Storage: <b id="chosenStorage" style="color:#fff"></b><br>Condition: <b id="chosenCondition" style="color:#fff"></b></div><button class="whatsapp" onclick="sendQuote()">💬 Send full inspection to WhatsApp</button><div class="notice">+971 56 570 2284 • Quote subject to physical inspection.</div></aside>
</div></main>`);
initCalc();
</script></body></html>
