<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AppleTrade.ae UAE — Apple device valuation demo."><link rel="stylesheet" href="styles.css"><script src="data.js"></script><script src="common.js"></script><style>.phone-shot{height:245px;position:relative;margin:8px auto 18px;max-width:260px}.ph{position:absolute;border-radius:30px;box-shadow:0 20px 38px #0009}.ph.back{width:128px;height:224px;left:22px;top:10px;background:linear-gradient(145deg,var(--finish),#252932);border:2px solid #ffffff2b}.ph.front{width:128px;height:224px;right:20px;top:17px;background:#080a0e;border:5px solid var(--finish);overflow:hidden}.ph.front:after{content:"";position:absolute;inset:4px;border-radius:22px;background:linear-gradient(145deg,#2578b9,#5545b9 48%,#9a416c)}.ph.front:before{content:"";position:absolute;z-index:2;top:9px;left:50%;transform:translateX(-50%);width:42px;height:12px;border-radius:10px;background:#010203}.cam{position:absolute;width:77px;height:76px;left:10px;top:11px;border-radius:22px;background:var(--finish);box-shadow:0 4px 15px #0004}.cam i{position:absolute;width:27px;height:27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#31547b 0 10%,#050608 35% 65%,#343b45 70%)}.cam i:nth-child(1){left:8px;top:8px}.cam i:nth-child(2){right:8px;top:8px}.cam i:nth-child(3){left:8px;bottom:8px}.phone-shot.nonpro .cam{width:62px;height:78px}.phone-shot.nonpro .cam i:nth-child(1){left:9px;top:8px}.phone-shot.nonpro .cam i:nth-child(2){right:8px;bottom:8px;top:auto}.phone-shot.nonpro .cam i:nth-child(3){display:none}.hero-device{transform:scale(1.55);transform-origin:center}.hero-product{overflow:hidden}.latest-card .phone-shot{transform:scale(.84);margin-top:-10px;margin-bottom:-8px}@media(max-width:620px){.hero-device{transform:scale(1.15)}.phone-shot{height:230px}}</style></head><body><script>
function finishFor(m){let n=m.name.toLowerCase();if(n.includes('18 pro'))return'#743047';if(n.includes('17 pro'))return'#d27643';if(n.includes('16 pro'))return'#b5aa98';if(n.includes('15 pro'))return'#8d8a82';if(n.includes('14 pro'))return'#5d526f';return'#8ca9c3'}
function phonePicture(m,hero=false){let pro=/pro/i.test(m.name);return `<div class="phone-shot ${pro?'pro':'nonpro'} ${hero?'hero-device':''}" style="--finish:${finishFor(m)}"><div class="ph back"><div class="cam"><i></i><i></i><i></i></div></div><div class="ph front"></div></div>`}
function latestCard(m,cta){const sell=m.base,trade=Math.round(m.base*1.05);return `<article class="latest-card"><div class="latest-top"><span class="new-badge">${m.badge||'APPLE'}</span><span class="retail">New from AED ${money(m.retail||0)}</span></div>${phonePicture(m)}<h3>${m.name}</h3><p>${m.display} • ${m.chip}</p><div class="price-row"><div><small>Sell from</small><b>AED ${money(sell)}</b></div><div><small>Trade-In from</small><b>AED ${money(trade)}</b></div></div><a class="card-link" href="sell.html?cat=iphone">${cta} →</a></article>`}
let heroM=CATALOG.iphone.models.find(x=>x.name==='iPhone 18 Pro')||CATALOG.iphone.models[0];
shell('home','AppleTrade.ae — Apple Device Valuation Demo',`<main><section class="top-banner"><div class="container"><span>NEW</span> Latest iPhone lineup • UAE demo estimates</div></section><section class="hero hero-modern"><div class="container hero-grid"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span> UAE • DEVELOPMENT DEMO</div><h1>Get more from your <em>iPhone.</em></h1><p class="lead">Explore estimated values from iPhone 11 through the latest models. Select the exact model, colour, storage and condition to preview a non-binding estimate.</p><div class="actions"><a class="btn btn-primary" href="sell.html?cat=iphone">Preview my iPhone value →</a><a class="btn btn-secondary" href="trade.html?cat=iphone">Preview Trade-In</a></div><div class="trust-row"><span>✓ Demo estimates</span><span>✓ Model-specific pricing</span><span>✓ Inspection required for any future final offer</span></div></div><div class="hero-product"><div class="hero-product-copy"><small>FEATURED</small><strong>${heroM.name}</strong><span>Selected-device preview</span><b>Demo estimate from AED ${money(heroM.base)}</b><em>AppleTrade original illustrative preview — not official product photography.</em></div>${phonePicture(heroM,true)}</div></div></section><section class="section latest-section"><div class="container"><div class="section-head"><div><div class="eyebrow">LATEST LINEUP</div><h2>Different model. Different preview.</h2><p>Each card now uses a model-aware AppleTrade preview rather than the same generic phone.</p></div><a class="text-link" href="devices.html">See all models →</a></div><div class="latest-grid">${latestCard(CATALOG.iphone.models[0],'Check value')}${latestCard(CATALOG.iphone.models[1],'Check value')}${latestCard(CATALOG.iphone.models[3],'Check value')}${latestCard(CATALOG.iphone.models[4],'Check value')}</div></div></section><section class="section light-section"><div class="container"><div class="section-head"><div><div class="eyebrow">IPHONE 11 → TODAY</div><h2>Choose the exact generation.</h2><p>Pro, Pro Max, Plus, mini, e and SE families are separated in the calculator.</p></div></div><div class="range-grid"><a href="sell.html?cat=iphone" class="range-card"><b>iPhone 11–13</b><span>11 • 11 Pro • 11 Pro Max • 12 mini • 12 • 12 Pro • 12 Pro Max • 13 mini • 13 • 13 Pro • 13 Pro Max • SE 3</span></a><a href="sell.html?cat=iphone" class="range-card"><b>iPhone 14–16</b><span>14 • 14 Plus • 14 Pro • 14 Pro Max • 15 • 15 Plus • 15 Pro • 15 Pro Max • 16e • 16 • 16 Plus • 16 Pro • 16 Pro Max</span></a><a href="sell.html?cat=iphone" class="range-card"><b>iPhone 17 family</b><span>17e • 17 • Air • 17 Pro • 17 Pro Max</span></a><a href="sell.html?cat=iphone" class="range-card"><b>Latest models</b><span>Select the newest available models from the calculator.</span></a></div></div></section><section class="section"><div class="container"><div class="grid2"><a class="service-card" href="sell.html"><div class="service-icon">AED</div><h3>Preview sell value</h3><p>Estimate an Apple device value based on exact configuration and condition.</p><span>Open demo →</span></a><a class="service-card featured" href="trade.html"><div class="service-icon">↗</div><h3>Preview Trade-In</h3><p>Explore a demo trade-in estimate for iPhone, iPad, MacBook or Watch.</p><span>Open demo →</span></a></div></div></section></main>`);
</script></body></html>
