<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><script src="data.js"></script><script src="common.js"></script></head><body><script>
let current='all';
function renderDevices(){const models=current==='all'?allModels():CATALOG[current].models.map(m=>({...m,category:current}));document.getElementById('deviceTable').innerHTML=models.map(m=>`<tr><td><strong>${m.name}</strong><br><span class="muted">${m.display} • ${m.chip}</span></td><td>${m.colors.map(c=>`<span class="pill">${c}</span>`).join('')}</td><td>${m.storage.map(s=>`<span class="pill">${s}</span>`).join('')}</td><td>${m.memory?m.memory.map(x=>`<span class="pill">${x}</span>`).join(''):'<span class="muted">—</span>'}</td></tr>`).join('')}
function setFilter(cat,btn){current=cat;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderDevices()}
shell('devices','AppleTrade.ae — Device Catalogue',`<main class="container"><section class="page-title"><div class="eyebrow">Research-backed catalogue</div><h1>Devices, colours & configurations.</h1><p class="lead">The calculator uses exact model families rather than a generic “iPhone” dropdown. MacBook memory is separate from SSD storage, and Watch connectivity is separate from capacity.</p></section><div class="filters"><button class="filter active" onclick="setFilter('all',this)">All</button><button class="filter" onclick="setFilter('iphone',this)">iPhone</button><button class="filter" onclick="setFilter('ipad',this)">iPad</button><button class="filter" onclick="setFilter('macbook',this)">MacBook</button><button class="filter" onclick="setFilter('watch',this)">Apple Watch</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Model</th><th>Colours / finishes</th><th>Storage / connectivity</th><th>Memory</th></tr></thead><tbody id="deviceTable"></tbody></table></div><section class="section"><div class="card"><h3>Important</h3><p class="muted">Apple's specifications can change when new models launch. The catalogue is kept in <code>data.js</code> so it can be updated without rebuilding the site. Trade values are AppleTrade.ae internal estimates, not Apple's official trade-in prices.</p></div></section></main>`);renderDevices();
</script></body></html>
