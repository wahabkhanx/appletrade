<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><script src="data.js"></script><script src="common.js"></script></head><body><script>
let current='all';
function retailLabel(m){return m.retail?`AED ${money(m.retail)}`:'—'}
function renderDevices(){const models=current==='all'?allModels():CATALOG[current].models.map(m=>({...m,category:current}));document.getElementById('deviceTable').innerHTML=models.map(m=>{const sell=m.base,trade=Math.round(m.base*1.05);return `<tr><td><strong>${m.name}</strong>${m.badge?` <span class="mini-badge">${m.badge}</span>`:''}<br><span class="muted">${m.display} • ${m.chip}</span></td><td>${m.colors.map(c=>`<span class="pill">${c}</span>`).join('')}</td><td>${m.storage.map(s=>`<span class="pill">${s}</span>`).join('')}</td><td>${m.memory?m.memory.map(x=>`<span class="pill">${x}</span>`).join(''):'<span class="muted">—</span>'}</td><td>${m.retail?`AED ${money(m.retail)}`:'—'}</td><td><strong>AED ${money(sell)}</strong><br><span class="muted">Trade: AED ${money(trade)}</span></td><td><a class="small-btn" href="sell.html?cat=${m.category}">Value</a></td></tr>`}).join('')}
function setFilter(cat,btn){current=cat;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderDevices()}
shell('devices','AppleTrade.ae — All Apple Models & Prices',`<main class="container"><section class="page-title"><div class="eyebrow">MODEL DIRECTORY • UAE</div><h1>Every model. Every configuration.</h1><p class="lead">A cleaner model directory inspired by premium Apple retail pages. iPhone 11 through the latest 2026 lineup are separated by family, colour and storage.</p></section><div class="filters"><button class="filter active" onclick="setFilter('all',this)">All devices</button><button class="filter" onclick="setFilter('iphone',this)">iPhone</button><button class="filter" onclick="setFilter('ipad',this)">iPad</button><button class="filter" onclick="setFilter('macbook',this)">MacBook</button><button class="filter" onclick="setFilter('watch',this)">Apple Watch</button></div><div class="table-wrap"><table class="table wide-table"><thead><tr><th>Model</th><th>Colours / finishes</th><th>Storage / connectivity</th><th>Memory</th><th>New reference</th><th>AppleTrade estimate</th><th></th></tr></thead><tbody id="deviceTable"></tbody></table></div><section class="section"><div class="card"><h3>How the prices work</h3><p class="muted">The "New reference" column is a retail reference where current Apple UAE pricing is available. AppleTrade "Sell" and "Trade-In" figures are internal used-device starting estimates and are intentionally lower than new retail. Condition, battery health, parts history, locks and physical inspection can reduce or change the final offer.</p></div></section></main>`);renderDevices();
</script></body></html>
