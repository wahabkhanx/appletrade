<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><script src="data.js"></script><script src="common.js"></script></head><body><script>
const mode='trade'; let cat='iphone', pickedColor='', pickedCondition='a+', quoteRejected=false;
const INSPECTION={battery:[{id:'b95',name:'95–100%',factor:1},{id:'b90',name:'90–94%',factor:.97},{id:'b85',name:'85–89%',factor:.93},{id:'b80',name:'80–84%',factor:.88},{id:'b79',name:'Below 80%',factor:.78}],screen:[{id:'s0',name:'Excellent',factor:1},{id:'s1',name:'Light scratches',factor:.97},{id:'s2',name:'Heavy scratches',factor:.88},{id:'s3',name:'Cracked / damaged',factor:.70}],body:[{id:'body0',name:'Excellent',factor:1},{id:'body1',name:'Light wear',factor:.97},{id:'body2',name:'Dents / heavy wear',factor:.88},{id:'body3',name:'Major damage',factor:.72}],functions:[{id:'f0',name:'All functions working',factor:1},{id:'f1',name:'Minor issue',factor:.90},{id:'f2',name:'Major function fault',factor:.70}],parts:[{id:'p0',name:'No replacement / Genuine Apple parts',factor:1},{id:'p1',name:'Genuine replacement part',factor:.95},{id:'p2',name:'Unknown / non-genuine part',factor:.84},{id:'p3',name:'Parts warning / unfinished repair',factor:.70}],lock:[{id:'l0',name:'Unlocked / ready to erase',factor:1},{id:'l1',name:'Carrier locked',factor:.96},{id:'l2',name:'Activation Lock / MDM / owner lock',factor:0}],region:[{id:'r0',name:'UAE / GCC version',factor:1},{id:'r1',name:'International version',factor:.98},{id:'r2',name:'US / eSIM-only or region-specific',factor:.96}],accessories:[{id:'a0',name:'Device only',bonus:0},{id:'a1',name:'Box + cable',bonus:25},{id:'a2',name:'Box + original cable + charger',bonus:50}]};
function optionList(id,a,s){document.getElementById(id).innerHTML=a.map(x=>`<option value="${x.id}" ${x.id===s?'selected':''}>${x.name}</option>`).join('')}function selectedModel(){return CATALOG[cat].models[Number(document.getElementById('model').value)]}function colorHex(c){let x=c.toLowerCase();if(x.includes('black'))return'#111827';if(x.includes('white'))return'#f5f5f5';if(x.includes('silver'))return'#d1d5db';if(x.includes('blue')||x.includes('glacier'))return'#8fb8df';if(x.includes('pink')||x.includes('rose'))return'#e9a9b9';if(x.includes('gold'))return'#d7b46a';if(x.includes('purple')||x.includes('lavender'))return'#a78bfa';if(x.includes('green')||x.includes('sage'))return'#94a884';if(x.includes('orange'))return'#f97316';if(x.includes('burgundy'))return'#7f1d3a';return'#94a3b8'}
function buildForm(){document.getElementById('model').innerHTML=CATALOG[cat].models.map((m,i)=>`<option value="${i}">${m.name}</option>`).join('');optionList('battery',INSPECTION.battery,'b90');optionList('screen',INSPECTION.screen,'s0');optionList('body',INSPECTION.body,'body0');optionList('functions',INSPECTION.functions,'f0');optionList('parts',INSPECTION.parts,'p0');optionList('lock',INSPECTION.lock,'l0');optionList('region',INSPECTION.region,'r0');optionList('accessories',INSPECTION.accessories,'a0');updateModel()}
function updateModel(){let m=selectedModel();document.getElementById('display').textContent=m.display;document.getElementById('chip').textContent=m.chip;document.getElementById('colors').innerHTML=m.colors.map((c,i)=>`<button class="color ${i?'':'active'}" onclick="pickColor('${c}',this)"><span class="color-dot" style="background:${colorHex(c)}"></span>${c}</button>`).join('');document.getElementById('storage').innerHTML=m.storage.map((s,i)=>`<option value="${i}">${s}</option>`).join('');let w=document.getElementById('memoryWrap');if(m.memory){w.style.display='block';document.getElementById('memory').innerHTML=m.memory.map(s=>`<option>${s}</option>`).join('')}else w.style.display='none';pickedColor=m.colors[0];document.getElementById('chosenColor').textContent=pickedColor;calculate();if(window.refreshProductPreview)setTimeout(window.refreshProductPreview,0)}
function pickColor(c,b){pickedColor=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('chosenColor').textContent=c;calculate();if(window.refreshProductPreview)setTimeout(window.refreshProductPreview,0)}function pickCondition(id,b){pickedCondition=id;document.querySelectorAll('.condition').forEach(x=>x.classList.remove('active'));b.classList.add('active');calculate()}function val(id,a){return a.find(x=>x.id===document.getElementById(id).value)||a[0]}
function calculate(){let m=selectedModel(),idx=Number(document.getElementById('storage').value)||0,cond=CONDITIONS.find(x=>x.id===pickedCondition)||CONDITIONS[0],base=m.base+(idx===0?0:idx===1?140:idx===2?320:520),battery=val('battery',INSPECTION.battery),screen=val('screen',INSPECTION.screen),body=val('body',INSPECTION.body),fn=val('functions',INSPECTION.functions),parts=val('parts',INSPECTION.parts),lock=val('lock',INSPECTION.lock),region=val('region',INSPECTION.region),acc=val('accessories',INSPECTION.accessories);quoteRejected=lock.factor===0;let price=Math.max(0,Math.round((base*cond.factor*battery.factor*screen.factor*body.factor*fn.factor*parts.factor*lock.factor*region.factor+acc.bonus)*1.05));document.getElementById('price').textContent=quoteRejected?'—':money(price);document.getElementById('chosenStorage').textContent=m.storage[idx];document.getElementById('chosenCondition').textContent=cond.name;document.getElementById('breakdown').innerHTML=quoteRejected?'<div class="reject">❌ Activation Lock / MDM / owner lock must be removed first.</div>':`<div class="breakdown-row"><span>Model + storage</span><b>AED ${money(base)}</b></div><div class="breakdown-row"><span>Demo trade-in adjustment</span><b class="green">+5%</b></div><div class="breakdown-row total"><span>Estimated demo value</span><b>AED ${money(price)}</b></div>`}
function initCalc(){let p=new URLSearchParams(location.search);cat=CATALOG[p.get('cat')]?p.get('cat'):'iphone';document.getElementById('catName').textContent=CATALOG[cat].label;buildForm();['battery','screen','body','functions','parts','lock','region','accessories'].forEach(id=>document.getElementById(id).addEventListener('change',calculate))}
shell('trade','AppleTrade.ae — Trade-In Demo',`<main class="container"><section class="page-title"><div class="eyebrow"><span class="dot"></span> TRADE-IN • DEMO ESTIMATE</div><h1>Trade-In your Apple device.</h1><p class="lead">Choose your exact device and condition to preview an estimated trade-in value.</p></section><div class="calc"><div class="card"><div class="form"><div class="field"><label>1. Category</label><div class="grid4"><a class="filter" href="trade.html?cat=iphone">📱 iPhone</a><a class="filter" href="trade.html?cat=ipad">📟 iPad</a><a class="filter" href="trade.html?cat=macbook">💻 Mac</a><a class="filter" href="trade.html?cat=watch">⌚ Watch</a></div></div><div class="field"><label>2. Exact model</label><select id="model" class="select" onchange="updateModel()"></select><p class="muted"><span id="catName"></span> • <span id="display"></span> • <span id="chip"></span></p></div><div class="field"><label>3. Colour / finish</label><div id="colors" class="color-row"></div></div><div class="field"><label>4. Storage / connectivity</label><select id="storage" class="select" onchange="calculate()"></select></div><div class="field" id="memoryWrap" style="display:none"><label>5. Unified memory</label><select id="memory" class="select" onchange="calculate()"></select></div><div class="field"><label>6. Overall condition</label><div class="condition-grid">${CONDITIONS.map((c,i)=>`<button class="condition ${i?'':'active'}" onclick="pickCondition('${c.id}',this)"><b>${c.name}</b><small>${c.desc}</small></button>`).join('')}</div></div><div class="field"><label>7. Detailed inspection</label><div class="inspection-grid">${[['battery','Battery health'],['screen','Screen'],['body','Body / frame / back'],['functions','Functions'],['parts','Parts & service history'],['lock','Activation / MDM / lock'],['region','Region / SIM'],['accessories','Box & accessories']].map(x=>`<div class="check-group"><label>${x[1]}</label><select id="${x[0]}"></select></div>`).join('')}</div></div></div></div><aside class="quote"><div class="eyebrow">Estimated demo trade-in value</div><div class="amount">AED <span id="price">0</span></div><p class="muted">Estimate only — not a guaranteed or binding offer. Any future exact value would require physical inspection and diagnostics.</p><div class="breakdown" id="breakdown"></div><div style="text-align:left;margin:18px 0;font-size:11px;color:#9aa7b7;line-height:1.8">Colour: <b id="chosenColor" style="color:#fff"></b><br>Storage: <b id="chosenStorage" style="color:#fff"></b><br>Condition: <b id="chosenCondition" style="color:#fff"></b></div><button class="whatsapp" onclick="sendQuote()">Preview Estimated Quote • Demo Only</button><div class="notice">Development demo • No sale, purchase or trade-in request is accepted.</div></aside></div></main>`);initCalc();
</script><script src="enhancements.js?v=20261005-3"></script></body></html>
